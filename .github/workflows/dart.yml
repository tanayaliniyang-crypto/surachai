name: Android Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # แก้ปัญหา Error: No file matched ที่คุณเจอ

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # ปล่อยว่างไว้ หรือระบุเป็นเวอร์ชันล่าสุด 
          # หรือลอง 3.24.0 เพื่อความชัวร์
          flutter-version: '3.24.3'

      - name: Build APK
        run: |
          cd surachai
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: surachai/build/app/outputs/flutter-apk/app-debug.apk